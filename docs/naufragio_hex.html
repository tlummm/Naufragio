<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .container { padding: 1.5rem; background: #16161a; min-height: 100vh; font-family: sans-serif; }
  .hex-section { display: flex; gap: 2rem; align-items: flex-start; flex-wrap: wrap; }
  .hex-wrap { flex: 0 0 300px; }
  .controls { flex: 1; min-width: 220px; }
  .attr-row { margin-bottom: 1.1rem; }
  .attr-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .attr-name { font-size: 13px; font-weight: 500; }
  .attr-tags { display: flex; align-items: center; gap: 4px; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 10px; }
  .tag-pen { background: rgba(226,75,74,0.25); color: #f09595; }
  .tag-bon { background: rgba(29,158,117,0.25); color: #5DCAA5; }
  .attr-val { font-size: 15px; font-weight: 500; color: #e8e6ff; min-width: 24px; text-align: right; }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.1);
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    cursor: grab;
  }
  input[type=range]::-webkit-slider-thumb:active { cursor: grabbing; }
  input[type=range]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: none;
    cursor: grab;
  }
  .page-title { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.6); margin-bottom: 1.5rem; letter-spacing: 0.03em; }
  .divider { height: 0.5px; background: rgba(255,255,255,0.08); margin: 1.2rem 0; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stat-card { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 10px 12px; border: 0.5px solid rgba(255,255,255,0.08); }
  .stat-label { font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 2px; }
  .stat-val { font-size: 18px; font-weight: 500; color: #e8e6ff; }
  .stat-val.small { font-size: 13px; padding-top: 3px; }
  .rules { margin-top: 1rem; font-size: 11px; color: rgba(255,255,255,0.35); line-height: 1.9; }
  .rules span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
</style>

<div class="container">
  <div class="page-title">Simulador de Atributos — Naufrágio</div>
  <div class="hex-section">
    <div class="hex-wrap">
      <canvas id="hexCanvas" width="300" height="300" role="img" aria-label="Hexágono de atributos do personagem"></canvas>
    </div>
    <div class="controls">
      <div id="sliders"></div>
      <div class="divider"></div>
      <div class="stat-grid" id="stats"></div>
      <div class="rules">
        <div><span style="background:#5DCAA5"></span>Adjacente próprio: +1 a cada 4 investidos</div>
        <div><span style="background:#f09595"></span>Oposto direto: −1 a cada 2 investidos</div>
        <div><span style="background:#FAC775"></span>Adjacente do oposto: −1 a cada 4 investidos</div>
      </div>
    </div>
  </div>
</div>

<script>
const ATTRS = [
  { id: 'agencia',   label: 'Agência',   color: '#AFA9EC', opp: 'essencia',  adjOwn: ['inocencia','ausencia'], adjOpp: ['ciencia','presenca'] },
  { id: 'ausencia',  label: 'Ausência',  color: '#85B7EB', opp: 'presenca',  adjOwn: ['agencia','ciencia'],    adjOpp: ['inocencia','essencia'] },
  { id: 'ciencia',   label: 'Ciência',   color: '#5DCAA5', opp: 'inocencia', adjOwn: ['ausencia','essencia'],  adjOpp: ['agencia','presenca'] },
  { id: 'essencia',  label: 'Essência',  color: '#F0997B', opp: 'agencia',   adjOwn: ['ciencia','presenca'],   adjOpp: ['ausencia','inocencia'] },
  { id: 'presenca',  label: 'Presença',  color: '#ED93B1', opp: 'ausencia',  adjOwn: ['essencia','inocencia'], adjOpp: ['ciencia','agencia'] },
  { id: 'inocencia', label: 'Inocência', color: '#FAC775', opp: 'ciencia',   adjOwn: ['presenca','agencia'],   adjOpp: ['essencia','ausencia'] },
];

const BASE = 5, MAX_INVEST = 20;
let invested = {};
ATTRS.forEach(a => invested[a.id] = 0);

function getEffective(id) {
  const a = ATTRS.find(x => x.id === id);
  const oppPen    = Math.floor(invested[a.opp] / 2);
  const adjOppPen = a.adjOpp.reduce((s, adj) => s + Math.floor(invested[adj] / 4), 0);
  const adjBonus  = a.adjOwn.reduce((s, adj) => s + Math.floor(invested[adj] / 4), 0);
  return Math.max(0, BASE + invested[id] - oppPen - adjOppPen + adjBonus);
}

function getDeltas(id) {
  const a = ATTRS.find(x => x.id === id);
  return {
    oppPen:    Math.floor(invested[a.opp] / 2),
    adjOppPen: a.adjOpp.reduce((s, adj) => s + Math.floor(invested[adj] / 4), 0),
    adjBonus:  a.adjOwn.reduce((s, adj) => s + Math.floor(invested[adj] / 4), 0),
  };
}

function buildSliders() {
  const div = document.getElementById('sliders');
  div.innerHTML = '';
  ATTRS.forEach(a => {
    const eff = getEffective(a.id);
    const { oppPen, adjOppPen, adjBonus } = getDeltas(a.id);
    const penTotal = oppPen + adjOppPen;
    const penTag = penTotal > 0 ? `<span class="tag tag-pen">-${penTotal}</span>` : '';
    const bonTag = adjBonus  > 0 ? `<span class="tag tag-bon">+${adjBonus}</span>` : '';

    const row = document.createElement('div');
    row.className = 'attr-row';
    row.innerHTML = `
      <div class="attr-header">
        <span class="attr-name" style="color:${a.color}">${a.label}</span>
        <div class="attr-tags">${penTag}${bonTag}<span class="attr-val">${eff}</span></div>
      </div>`;

    const input = document.createElement('input');
    input.type = 'range';
    input.min = 0;
    input.max = MAX_INVEST;
    input.step = 1;
    input.value = invested[a.id];
    input.dataset.id = a.id;

    const pct = (invested[a.id] / MAX_INVEST) * 100;
    input.style.background = `linear-gradient(to right, ${a.color} ${pct}%, rgba(255,255,255,0.1) ${pct}%)`;

    const styleId = `thumb-style-${a.id}`;
    if (!document.getElementById(styleId)) {
      const s = document.createElement('style');
      s.id = styleId;
      s.textContent = `
        input[data-id="${a.id}"]::-webkit-slider-thumb { background: ${a.color}; }
        input[data-id="${a.id}"]::-moz-range-thumb { background: ${a.color}; }
      `;
      document.head.appendChild(s);
    }

    input.addEventListener('input', e => {
      invested[e.target.dataset.id] = parseInt(e.target.value);
      const pct2 = (e.target.value / MAX_INVEST) * 100;
      e.target.style.background = `linear-gradient(to right, ${a.color} ${pct2}%, rgba(255,255,255,0.1) ${pct2}%)`;
      rebuildTags();
      buildStats();
      drawHex();
    });

    row.appendChild(input);
    div.appendChild(row);
  });
}

function rebuildTags() {
  document.querySelectorAll('.attr-row').forEach((row, i) => {
    const a = ATTRS[i];
    const eff = getEffective(a.id);
    const { oppPen, adjOppPen, adjBonus } = getDeltas(a.id);
    const penTotal = oppPen + adjOppPen;
    const penTag = penTotal > 0 ? `<span class="tag tag-pen">-${penTotal}</span>` : '';
    const bonTag = adjBonus  > 0 ? `<span class="tag tag-bon">+${adjBonus}</span>` : '';
    const tagsDiv = row.querySelector('.attr-tags');
    tagsDiv.innerHTML = `${penTag}${bonTag}<span class="attr-val">${eff}</span>`;
  });
}

function buildStats() {
  const effs = ATTRS.map(a => getEffective(a.id));
  const total = effs.reduce((s,v) => s+v, 0);
  const divino = Math.max(0, Math.round(100 - (Math.max(...effs) - Math.min(...effs)) * 4));
  const dominant = ATTRS[effs.indexOf(Math.max(...effs))];
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total efetivo</div><div class="stat-val">${total}</div></div>
    <div class="stat-card"><div class="stat-label">Equilíbrio divino</div><div class="stat-val">${divino}%</div></div>
    <div class="stat-card"><div class="stat-label">Dominante</div><div class="stat-val small">${dominant.label}</div></div>
  `;
}

function drawHex() {
  const canvas = document.getElementById('hexCanvas');
  const ctx = canvas.getContext('2d');
  const W = 300, H = 300, cx = W/2, cy = H/2, R = 108;
  ctx.clearRect(0,0,W,H);

  function pt(i, r) {
    const angle = (Math.PI / 3) * i - Math.PI / 2;
    return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
  }

  for (let s = 1; s <= 5; s++) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const [x,y] = pt(i, R * s/5);
      i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1; ctx.stroke();
  }
  for (let i = 0; i < 6; i++) {
    const [x,y] = pt(i, R);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y);
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1; ctx.stroke();
  }

  const maxEff = BASE + MAX_INVEST + 2 * Math.floor(MAX_INVEST/4);
  ctx.beginPath();
  ATTRS.forEach((a,i) => {
    const frac = Math.min(getEffective(a.id) / maxEff, 1);
    const [x,y] = pt(i, R * frac);
    i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(175,169,236,0.13)'; ctx.fill();
  ctx.strokeStyle = '#AFA9EC'; ctx.lineWidth = 2; ctx.stroke();

  ATTRS.forEach((a,i) => {
    const frac = Math.min(getEffective(a.id) / maxEff, 1);
    const [x,y] = pt(i, R * frac);
    ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fillStyle = a.color; ctx.fill();
  });

  ATTRS.forEach((a,i) => {
    const [lx,ly] = pt(i, R + 20);
    ctx.font = '11px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(a.label, lx, ly);
  });

  ctx.beginPath(); ctx.arc(cx,cy,16,0,Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.font = '9px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Divino', cx, cy);
}

buildSliders();
buildStats();
drawHex();
</script>
